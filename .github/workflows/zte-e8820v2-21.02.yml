name: Build OpenWrt v21.02.7 ZTE E8820V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4
      
    - name: Set Build Date & Timezone
      run: |
        sudo timedatectl set-timezone "Asia/Jakarta"
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Clean & Install prerequisites
      run: |
        sudo docker rmi $(docker image ls -q) 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y purge azure-cli google-cloud-cli google-chrome-stable firefox powershell dotnet-sdk*
        sudo -E apt-get update
        sudo -E apt-get -y install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget ccache
        sudo -E apt-get autoremove --purge -y
        sudo -E apt-get clean

    - name: Clone OpenWrt v21.02.7
      run: |
        git clone https://github.com/openwrt/openwrt.git
        cd openwrt
        git pull
        git checkout v21.02.7

    - name: Cache dl and build_dir
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir
        key: ${{ runner.os }}-openwrt-21.02.7-${{ hashFiles('**/*.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-21.02.7-

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply custom files (Overwrite Config, DTS, MK, LED & Network)
      run: |
        set -e
        # ✅ ملف الإعدادات من المجلد الرئيسي
        cp zte-e8820v2-21.02.config openwrt/.config
        
        # ✅ نسخ ملفات DTS و mt7621.mk من مجلد custom
        cp custom/mt7621.mk openwrt/target/linux/ramips/image/mt7621.mk
        cp custom/mt7621_zte_e8820v2.dts openwrt/target/linux/ramips/dts/mt7621_zte_e8820v2.dts
        cp custom/01_leds openwrt/target/linux/ramips/mt7621/base-files/etc/board.d/01_leds
        cp custom/02_network openwrt/target/linux/ramips/mt7621/base-files/etc/board.d/02_network
        
        # ✅ نسخ مجلد files/ (جديد!)
        mkdir -p openwrt/files
        [ -d files ] && cp -r files/* openwrt/files/ 2>/dev/null || true
        echo "=== محتوى مجلد files المنسوخ ==="
        find openwrt/files -type f 2>/dev/null || echo "لا توجد ملفات"
        
        cd openwrt
        make defconfig
        
    - name: Download Package Source (Pre-download)
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size 0 -exec rm -f {} \;

    - name: Build firmware
      run: |
        cd openwrt
        JOBS=$(nproc || echo 2)
        echo "Using $JOBS parallel jobs"
        export CCACHE_DIR="$HOME/.ccache"
        mkdir -p "$CCACHE_DIR"
        ccache -C || true
        ccache -M 2G || true
        time make -j"$JOBS" || make -j1 V=s
        echo "✓ Build finished"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_21.02.7_ZTE_E8820V2_${{ env.BUILD_DATE }}
        path: openwrt/bin
